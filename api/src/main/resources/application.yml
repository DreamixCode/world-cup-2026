spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
          audiences:
            - ${GOOGLE_OAUTH2_CLIENT_ID:}

  mongodb:
    uri: ${MONGODB_URI:mongodb://root:wc-dreamix@localhost:27017/wc2026?authSource=admin}
    database: ${MONGODB_DATABASE:wc2026}
  # Single Page
  mvc:
    static-path-pattern: /public*
  web:
    resources:
      add-mappings: true

app:
  security:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
#      We gonna add the Frontend from Tancheto here as well

# OpenAPI
springdoc.packagesToScan: eu.dreamix

server.tomcat.accesslog.enabled: true

football-api:
  url: ${FOOTBALL_API_URL:https://v3.football.api-sports.io}
  api-key: ${FOOTBALL_API_KEY:}
  api-key-header: x-rapidapi-key
  league-id: ${FOOTBALL_API_LEAGUE_ID:1}
  season: ${FOOTBALL_API_SEASON:2026}

#feign
feign:
  client:
    config:
      football-api:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full
        requestInterceptors:
          - eu.dreamix.wcapi.external.fbapi.ApiKeyInterceptor

scheduler:
  enabled: ${SCHEDULER_ENABLED:false}
  match-retrieval.active-cron: "${SCHEDULER_MATCH_ACTIVE_CRON:0 * 0-6,16-23 * * *}"
  match-retrieval.inactive-cron: "${SCHEDULER_MATCH_INACTIVE_CRON:0 */30 7-15 * * *}"
  standing-retrieval.active-cron: "${SCHEDULER_STANDING_ACTIVE_CRON:0 */30 0-6,16-23 * * *}"
  top-scorer-retrieval.cron: "${SCHEDULER_TOP_SCORER_CRON:0 0 * * * *}"
